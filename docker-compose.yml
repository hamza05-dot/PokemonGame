volumes: {}

services:
  oracle-db:
    image: hamza518/oracle-xe-11g-r2
    container_name: pokemon_oracle_db
    ports:
      - "1522:1521"
    environment:
      - ORACLE_ALLOW_REMOTE=true
    volumes:
      - ./Database/oracle-data:/opt/oracle/oradata
    networks:
      - pokemon-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: pokemon_backend
    depends_on:
      - oracle-db
    environment:
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SID=${DB_SID}
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    networks:
      - pokemon-network
    restart: unless-stopped
    command: >
      sh -c "sleep 30 && python -m flask run --host=0.0.0.0 --port=5000 --reload"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pokemon_frontend
    depends_on:
      - backend
    environment:
      - DB_HOST=oracle-db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SID=${DB_SID}
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/logs:/var/log/nginx
    networks:
      - pokemon-network
    restart: unless-stopped

networks:
  pokemon-network:
    driver: bridge
