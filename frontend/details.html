<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Pokemon Details - PokéDex</title>
    <link rel="stylesheet" href="details.css">
    <link rel="stylesheet" href="navigation.css">
    <style>
        /* 1. COMPLETELY DISABLE OVERSCROLL AT THE ROOT */
        html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent the html element itself from scrolling */
            overscroll-behavior: none; /* Disable the rubber-band/white space effect */
        }

        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            /* 2. ENSURE BACKGROUND IS FIXED AND COVERS EVERYTHING */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            color: #333;
            
            /* 3. ALLOW SCROLLING ONLY ON THE BODY */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; /* Smooth scroll for iOS */
            overscroll-behavior-y: none; /* Secondary block for mobile browsers */
        }

        /* Buffer for navigation if it's sticky/fixed */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #detail-container {
            padding-bottom: 50px; /* Prevent content from hitting the bottom edge */
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔍</span>
                <span class="logo-text">PokéSearch</span>
            </a>
            
            <button class="nav-toggle" id="navToggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">
                    <span class="link-icon">🏠</span>
                    <span>Home</span>
                </a>
                <a href="types-list.html" class="nav-link">
                    <span class="link-icon">⚡</span>
                    <span>Types</span>
                </a>
                <a href="abilities-list.html" class="nav-link">
                    <span class="link-icon">💪</span>
                    <span>Abilities</span>
                </a>
                <a class="nav-link disabled">
                    <span class="link-icon">⭐</span>
                    <span>Favourites</span>
                </a>
                <a class="nav-link disabled">
                    <span class="link-icon">👥</span>
                    <span>Team</span>
                </a>
                <a class="nav-link disabled">
                    <span class="link-icon">👤</span>
                    <span>Profile</span>
                </a>
            </div>
        </div>
    </nav>

    <div id="detail-container">
        <p style="color:white; text-align:center;">Loading...</p>
    </div>

    <script src="navigation.js"></script>
    <script src="details.js"></script>
</body>
</html>
