<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>All Abilities - PokéDex</title>
    <link rel="stylesheet" href="navigation.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .abilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .ability-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
            display: block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }

        .ability-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .ability-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .ability-description {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .pokemon-count {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e9ecef;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .abilities-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">🔍 PokéSearch</a>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">🏠 Home</a>
                <a href="types-list.html" class="nav-btn">⚡ Types</a>
                <a href="abilities-list.html" class="nav-btn active">💪 Abilities</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>💪 All Pokémon Abilities</h1>
        
        <div class="search-box">
            <input type="text" id="ability-search" placeholder="🔍 Search abilities by name..." oninput="filterAbilities()">
        </div>

        <div id="abilities-container">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        let allAbilities = [];

        async function loadAbilities() {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/abilities');
                allAbilities = await response.json();
                displayAbilities(allAbilities);
            } catch (error) {
                console.error('Error loading abilities:', error);
                document.getElementById('abilities-container').innerHTML = `
                    <p style="color:white; text-align:center;">Failed to load abilities</p>
                `;
            }
        }

        function displayAbilities(abilities) {
            const container = document.getElementById('abilities-container');
            
            if (abilities.length === 0) {
                container.innerHTML = '<p class="no-results">No abilities found</p>';
                return;
            }

            container.innerHTML = `
                <div class="abilities-grid">
                    ${abilities.map(ability => `
                        <a href="abilitie.html?id=${ability.id}" class="ability-card">
                            <div class="ability-name">${ability.name}</div>
                            <div class="ability-description">
                                ${ability.description || 'No description available'}
                            </div>
                            <span class="pokemon-count">${ability.pokemon_count} Pokémon</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function filterAbilities() {
            const searchTerm = document.getElementById('ability-search').value.toLowerCase();
            const filtered = allAbilities.filter(ability => 
                ability.name.toLowerCase().includes(searchTerm) ||
                (ability.description && ability.description.toLowerCase().includes(searchTerm))
            );
            displayAbilities(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadAbilities);
    </script>
</body>
</html>
