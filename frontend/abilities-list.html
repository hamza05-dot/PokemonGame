<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>All Abilities - PokéSearch</title>
    <link rel="stylesheet" href="navigation.css">
    <style>
        /* ===================================
           ABILITIES LIST - ENHANCED STYLES
           =================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Root level locking for mobile bounce fix */
        html {
            height: 100%;
            width: 100%;
            overflow: hidden; 
            overscroll-behavior: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(15px, 3vw, 30px);
        }

        h1 {
            color: white;
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 25px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* SEARCH & CONTROLS */
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .search-box input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
        }

        .sort-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sort-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* ABILITIES GRID */
        .abilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .ability-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-left: 6px solid #667eea;
            height: 100%;
        }

        .ability-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .ability-name {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: capitalize;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .ability-description {
            font-size: 0.95rem;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pokemon-count-badge {
            align-self: flex-start;
            background: #f0f4ff;
            color: #5a67d8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #e0e7ff;
        }

        /* LOADING SPINNER */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 100px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            .abilities-grid { grid-template-columns: 1fr; }
            .ability-card { padding: 20px; }
            .ability-name { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔍</span>
                <span class="logo-text">PokéSearch</span>
            </a>
            <button class="nav-toggle" id="navToggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link"><span class="link-icon">🏠</span><span>Home</span></a>
                <a href="types-list.html" class="nav-link"><span class="link-icon">⚡</span><span>Types</span></a>
                <a href="abilities-list.html" class="nav-link active"><span class="link-icon">💪</span><span>Abilities</span></a>
                <a class="nav-link disabled"><span class="link-icon">⭐</span><span>Favourites</span></a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>💪 All Abilities</h1>
        
        <div class="search-box">
            <input type="text" id="ability-search" placeholder="🔍 Search abilities or descriptions..." oninput="filterAbilities()">
        </div>

        <div class="controls">
            <button class="sort-btn" onclick="toggleSort()">
                <span id="sort-text">⬆️ Sort: A-Z</span>
            </button>
        </div>

        <div id="abilities-container">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script>
let allAbilities = [];
        let sortAsc = true;

        const API_ENDPOINTS = {
            primary: 'http://localhost:5000',
            fallback: 'https://delila-wakeless-maranda.ngrok-free.dev'
        };

        let currentEndpoint = API_ENDPOINTS.primary;

        /**
         * Corrected apiFetch with proper await and headers for ngrok
         */
        async function apiFetch(path, options = {}) {
            const headers = { 
                ...options.headers, 
                "ngrok-skip-browser-warning": "true" 
            };
            
            try {
                const response = await fetch(`${currentEndpoint}${path}`, { ...options, headers });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response;
            } catch (error) {
                // If the local API fails, we MUST await the fallback call
                if (currentEndpoint === API_ENDPOINTS.primary) {
                    console.warn("Primary API failed, switching to fallback...");
                    currentEndpoint = API_ENDPOINTS.fallback;
                    
                    // Added 'await' here so the function waits for ngrok to respond
                    const response = await fetch(`${currentEndpoint}${path}`, { ...options, headers });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                }
                throw error;
            }
        }

        async function loadAbilities() {
            const container = document.getElementById('abilities-container');
            try {
                const response = await apiFetch('/api/abilities');
                allAbilities = await response.json();
                displayAbilities(allAbilities);
            } catch (error) {
                console.error("Load failed:", error);
                container.innerHTML = `<p class="no-results">Failed to connect to API at ${currentEndpoint}.<br>Error: ${error.message}</p>`;
            }
        }

        function toggleSort() {
            sortAsc = !sortAsc;
            document.getElementById('sort-text').textContent = sortAsc ? '⬆️ Sort: A-Z' : '⬇️ Sort: Z-A';
            filterAbilities();
        }

        function filterAbilities() {
            const term = document.getElementById('ability-search').value.toLowerCase();
            const filtered = allAbilities.filter(a => 
                a.name.toLowerCase().includes(term) || 
                (a.description && a.description.toLowerCase().includes(term))
            );
            displayAbilities(filtered);
        }

        function displayAbilities(abilities) {
            const container = document.getElementById('abilities-container');
            
            if (abilities.length === 0) {
                container.innerHTML = '<p class="no-results">No abilities matching your search.</p>';
                return;
            }

            const sorted = [...abilities].sort((a, b) => 
                sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name)
            );

            container.innerHTML = `
                <div class="abilities-grid">
                    ${sorted.map(ability => `
                        <a href="abilitie.html?id=${ability.id}" class="ability-card">
                            <div class="ability-name">${ability.name.replace(/-/g, ' ')}</div>
                            <div class="ability-description">
                                ${ability.description || 'No description available for this ability.'}
                            </div>
                            <div class="pokemon-count-badge">
                                👥 ${ability.pokemon_count} Pokémon
                            </div>
                        </a>
                    `).join('')}
                </div>`;
        }

        document.addEventListener('DOMContentLoaded', loadAbilities);
    </script>
</body>
</html>
