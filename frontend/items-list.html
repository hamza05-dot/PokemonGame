<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>All Items - PokéSearch</title>
    <link rel="stylesheet" href="navigation.css">
    <style>
        /* ===================================
           ITEMS LIST - ENHANCED STYLES
           =================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Root level locking for mobile bounce fix */
        html {
            height: 100%;
            width: 100%;
            overflow: hidden; 
            overscroll-behavior: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(15px, 3vw, 30px);
        }

        h1 {
            color: white;
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 25px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* SEARCH & CONTROLS */
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .search-box input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .sort-btn, .filter-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sort-btn:hover, .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        /* ITEMS GRID */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #333;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-left: 6px solid #667eea;
            height: 100%;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .item-sprite {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #f7fafc;
            border-radius: 10px;
            padding: 5px;
        }

        .item-name {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: capitalize;
            color: #2c3e50;
            flex: 1;
        }

        .item-category {
            background: #e6fffa;
            color: #234e52;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid #b2f5ea;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .item-description {
            font-size: 0.95rem;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .item-cost {
            align-self: flex-start;
            background: #fff5f5;
            color: #c53030;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #fed7d7;
        }

        /* LOADING SPINNER */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 100px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            .items-grid { grid-template-columns: 1fr; }
            .item-card { padding: 20px; }
            .item-name { font-size: 1.25rem; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔍</span>
                <span class="logo-text">PokéSearch</span>
            </a>
            <button class="nav-toggle" id="navToggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link"><span class="link-icon">🏠</span><span>Home</span></a>
                <a href="types-list.html" class="nav-link"><span class="link-icon">⚡</span><span>Types</span></a>
                <a href="abilities-list.html" class="nav-link"><span class="link-icon">💪</span><span>Abilities</span></a>
                <a href="items-list.html" class="nav-link active"><span class="link-icon">🎒</span><span>Items</span></a>
                <a class="nav-link disabled"><span class="link-icon">⭐</span><span>Favourites</span></a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>🎒 All Items</h1>
        
        <div class="search-box">
            <input type="text" id="item-search" placeholder="🔎 Search items or descriptions..." oninput="filterItems()">
        </div>

        <div class="controls">
            <button class="sort-btn" onclick="toggleSort()">
                <span id="sort-text">⬆️ Sort: A-Z</span>
            </button>
            <button class="filter-btn" id="filter-btn" onclick="toggleCategoryFilter()">
                <span id="filter-text">📦 All Categories</span>
            </button>
        </div>

        <div id="items-container">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script>
        let allItems = [];
        let sortAsc = true;
        let currentCategory = '';

        const API_ENDPOINTS = {
            primary: 'http://localhost:5000',
            fallback: 'https://delila-wakeless-maranda.ngrok-free.dev'
        };

        let currentEndpoint = API_ENDPOINTS.primary;

        /**
         * API fetch with fallback support
         */
        async function apiFetch(path, options = {}) {
            const headers = { 
                ...options.headers, 
                "ngrok-skip-browser-warning": "true" 
            };
            
            try {
                const response = await fetch(`${currentEndpoint}${path}`, { ...options, headers });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response;
            } catch (error) {
                if (currentEndpoint === API_ENDPOINTS.primary) {
                    console.warn("Primary API failed, switching to fallback...");
                    currentEndpoint = API_ENDPOINTS.fallback;
                    
                    const response = await fetch(`${currentEndpoint}${path}`, { ...options, headers });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                }
                throw error;
            }
        }

        async function loadItems() {
            const container = document.getElementById('items-container');
            try {
                const response = await apiFetch('/api/items');
                allItems = await response.json();
                displayItems(allItems);
            } catch (error) {
                console.error("Load failed:", error);
                container.innerHTML = `<p class="no-results">Failed to connect to API at ${currentEndpoint}.<br>Error: ${error.message}</p>`;
            }
        }

        function toggleSort() {
            sortAsc = !sortAsc;
            document.getElementById('sort-text').textContent = sortAsc ? '⬆️ Sort: A-Z' : '⬇️ Sort: Z-A';
            filterItems();
        }

        function toggleCategoryFilter() {
            const categories = [...new Set(allItems.map(item => item.category))].filter(Boolean);
            
            if (currentCategory === '') {
                // Cycle through categories
                currentCategory = categories[0] || '';
            } else {
                const currentIndex = categories.indexOf(currentCategory);
                if (currentIndex === categories.length - 1) {
                    currentCategory = '';
                } else {
                    currentCategory = categories[currentIndex + 1];
                }
            }
            
            const filterBtn = document.getElementById('filter-btn');
            const filterText = document.getElementById('filter-text');
            
            if (currentCategory === '') {
                filterText.textContent = '📦 All Categories';
                filterBtn.classList.remove('active');
            } else {
                filterText.textContent = `📦 ${currentCategory.replace(/-/g, ' ')}`;
                filterBtn.classList.add('active');
            }
            
            filterItems();
        }

        function filterItems() {
            const term = document.getElementById('item-search').value.toLowerCase();
            let filtered = allItems.filter(item => {
                const name = item.item_name || '';
                const effect = item.effect || '';
                return name.toLowerCase().includes(term) || effect.toLowerCase().includes(term);
            });
            
            if (currentCategory !== '') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }
            
            displayItems(filtered);
        }

        function displayItems(items) {
            const container = document.getElementById('items-container');
            
            if (items.length === 0) {
                container.innerHTML = '<p class="no-results">No items matching your search.</p>';
                return;
            }

            const sorted = [...items].sort((a, b) => {
                const nameA = a.item_name || '';
                const nameB = b.item_name || '';
                return sortAsc ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
            });

            container.innerHTML = `
                <div class="items-grid">
                    ${sorted.map(item => {
                        const itemName = item.item_name || 'Unknown Item';
                        const category = item.category;
                        const effect = item.effect || 'No description available for this item.';
                        const sprite = item.sprite;
                        const cost = item.cost;
                        
                        return `
                        <div class="item-card">
                            <div class="item-header">
                                ${sprite ? `<img src="${sprite}" alt="${itemName}" class="item-sprite" onerror="this.style.display='none'">` : ''}
                                <div class="item-name">${itemName.replace(/-/g, ' ')}</div>
                            </div>
                            ${category ? `<div class="item-category">${category.replace(/-/g, ' ')}</div>` : ''}
                            <div class="item-description">
                                ${effect}
                            </div>
                            ${cost && cost > 0 ? `<div class="item-cost">💰 ${cost.toLocaleString()} Poké</div>` : ''}
                        </div>
                        `;
                    }).join('')}
                </div>`;
        }

        document.addEventListener('DOMContentLoaded', loadItems);
    </script>
</body>
</html>
