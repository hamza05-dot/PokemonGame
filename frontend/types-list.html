<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>All Types - PokéSearch</title>
    <link rel="stylesheet" href="navigation.css">
    <style>
        /* ===================================
           TYPES LIST - ENHANCED STYLES
           =================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* FIXED: Root level locking to prevent white space bounce */
        html {
            height: 100%;
            width: 100%;
            overflow: hidden; 
            overscroll-behavior: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(15px, 3vw, 30px);
        }

        h1 {
            color: white;
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 25px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* CONTROLS */
        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
        }

        .sort-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sort-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* GRID & CARDS */
        .types-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .type-card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: #333;
            display: block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-bottom: 6px solid #ddd;
            position: relative;
        }

        .type-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .type-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
            transition: transform 0.3s ease;
        }

        .type-card:hover .type-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .type-name {
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: capitalize;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .pokemon-count {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: 600;
            background: #f8f9fa;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* TYPE ACCENT COLORS */
        .type-normal { border-bottom-color: #A8A878; }
        .type-fire { border-bottom-color: #F08030; }
        .type-water { border-bottom-color: #6890F0; }
        .type-electric { border-bottom-color: #F8D030; }
        .type-grass { border-bottom-color: #78C850; }
        .type-ice { border-bottom-color: #98D8D8; }
        .type-fighting { border-bottom-color: #C03028; }
        .type-poison { border-bottom-color: #A040A0; }
        .type-ground { border-bottom-color: #E0C068; }
        .type-flying { border-bottom-color: #A890F0; }
        .type-psychic { border-bottom-color: #F85888; }
        .type-bug { border-bottom-color: #A8B820; }
        .type-rock { border-bottom-color: #B8A038; }
        .type-ghost { border-bottom-color: #705898; }
        .type-dragon { border-bottom-color: #7038F8; }
        .type-dark { border-bottom-color: #705848; }
        .type-steel { border-bottom-color: #B8B8D0; }
        .type-fairy { border-bottom-color: #EE99AC; }

        /* LOADING SPINNER */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 100px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .types-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .type-card { padding: 20px 10px; }
            .type-icon { font-size: 2.5rem; }
            .type-name { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🔍</span>
                <span class="logo-text">PokéSearch</span>
            </a>
            <button class="nav-toggle" id="navToggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link"><span class="link-icon">🏠</span><span>Home</span></a>
                <a href="types-list.html" class="nav-link active"><span class="link-icon">⚡</span><span>Types</span></a>
                <a href="abilities-list.html" class="nav-link"><span class="link-icon">💪</span><span>Abilities</span></a>
                <a href="items-list.html" class="nav-link"><span class="link-icon">🎒</span><span>Item</span></a>
                <a class="nav-link disabled"><span class="link-icon">⭐</span><span>Favourites</span></a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>⚡ All Pokémon Types</h1>
        <div class="controls">
            <button class="sort-btn" onclick="toggleSort()">
                <span id="sort-text">⬆️ Sort: A-Z</span>
            </button>
        </div>
        <div id="types-container">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script>
        const typeIcons = {
            normal: "⭐", fire: "🔥", water: "💧", electric: "⚡", grass: "🌿", ice: "❄️", 
            fighting: "👊", poison: "☠️", ground: "🌍", flying: "🦅", psychic: "🔮", bug: "🐛",
            rock: "🪨", ghost: "👻", dragon: "🐉", dark: "🌑", steel: "⚙️", fairy: "🧚"
        };

        let allTypes = [];
        let sortAsc = true;

        const API_ENDPOINTS = {
            primary: 'http://localhost:5000',
            fallback: 'https://delila-wakeless-maranda.ngrok-free.dev'
        };

        let currentEndpoint = API_ENDPOINTS.primary;

        async function apiFetch(path) {
            const headers = { "ngrok-skip-browser-warning": "true" };
            try {
                const response = await fetch(`${currentEndpoint}${path}`, { headers });
                if (!response.ok) throw new Error();
                return response;
            } catch (error) {
                if (currentEndpoint === API_ENDPOINTS.primary) {
                    currentEndpoint = API_ENDPOINTS.fallback;
                    return fetch(`${currentEndpoint}${path}`, { headers });
                }
                throw error;
            }
        }

        async function loadTypes() {
            try {
                const response = await apiFetch('/api/types');
                allTypes = await response.json();
                displayTypes();
            } catch (error) {
                document.getElementById('types-container').innerHTML = `<p style="color:white; text-align:center;">Failed to load.</p>`;
            }
        }

        function toggleSort() {
            sortAsc = !sortAsc;
            document.getElementById('sort-text').textContent = sortAsc ? '⬆️ Sort: A-Z' : '⬇️ Sort: Z-A';
            displayTypes();
        }

        function displayTypes() {
            const sorted = [...allTypes].sort((a, b) => sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
            document.getElementById('types-container').innerHTML = `
                <div class="types-grid">
                    ${sorted.map(type => `
                        <a href="type.html?name=${type.name.toLowerCase()}" class="type-card type-${type.name.toLowerCase()}">
                            <span class="type-icon">${typeIcons[type.name.toLowerCase()] || '❓'}</span>
                            <div class="type-name">${type.name}</div>
                            <div class="pokemon-count">${type.pokemon_count} Pokémon</div>
                        </a>
                    `).join('')}
                </div>`;
        }

        document.addEventListener('DOMContentLoaded', loadTypes);
    </script>
</body>
</html>
